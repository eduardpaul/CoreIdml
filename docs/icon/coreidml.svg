<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- CoreIdml icon: a page with a selected text frame (corner handles). Deep teal + warm yellow. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14807C"/>
      <stop offset="1" stop-color="#0A4549"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#032426" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect x="48" y="48" width="928" height="928" rx="208" fill="url(#tile)"/>
  <!-- page -->
  <rect x="240" y="168" width="544" height="688" rx="40" fill="#FFFFFF" filter="url(#shadow)"/>
  <!-- heading -->
  <rect x="312" y="240" width="300" height="60" rx="30" fill="#0B4F55"/>
  <!-- body line below the frame -->
  <rect x="312" y="744" width="400" height="44" rx="22" fill="#A3D0CC"/>
  <!-- selected text frame -->
  <rect x="192" y="380" width="640" height="288" rx="8" fill="#FFF1C7" stroke="#FFC83D" stroke-width="28"/>
  <rect x="272" y="452" width="480" height="52" rx="26" fill="#2B7A75"/>
  <rect x="272" y="544" width="320" height="52" rx="26" fill="#2B7A75"/>
  <!-- corner handles -->
  <g fill="#FFC83D" stroke="#0A4549" stroke-width="14">
    <rect x="144" y="332" width="96" height="96" rx="14"/>
    <rect x="784" y="332" width="96" height="96" rx="14"/>
    <rect x="144" y="620" width="96" height="96" rx="14"/>
    <rect x="784" y="620" width="96" height="96" rx="14"/>
  </g>
</svg>
