name: Release

# Builds every package of every platform, tests what was built, and publishes.
#
#   push of a v* tag        build, test, then publish: NuGet, npm, PyPI and a GitHub release (needs the tag's version
#                           in Directory.Build.props and every manifest: node eng/set-version.mjs --check)
#   push to main            the same build and tests as a dry run (version <prefix>-ci.<run>); nothing is published
#   run by hand             a dry run of the chosen ref
#
# Publishing uses trusted publishing (OpenID Connect), so no long-lived secret is needed once the registries trust
# this workflow; see CONTRIBUTING.md for the one-time setup. Each registry is opt-in through a repository variable
# (NUGET_USER, PUBLISH_NPM, PUBLISH_PYPI); the GitHub release with every binary is always created. The publish jobs
# run in the "release" environment, which can require an approval.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v5
      - id: version
        name: Version of this build
        run: |
          node eng/set-version.mjs --check
          prefix="$(node eng/set-version.mjs --print)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            base="${version%%-*}"
            if [[ "$base" != "$prefix" ]]; then
              echo "::error::The tag is $GITHUB_REF_NAME but Directory.Build.props says $prefix. Bump the version in a commit first."
              exit 1
            fi
            publish=true
          else
            version="$prefix-ci.$GITHUB_RUN_NUMBER"
            publish=false
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Version $version (publish: $publish)"

  # The native library, the command line and the Python wheel of each platform, each tested where it was built.
  # Native AOT does not cross-compile between operating systems. Linux builds run in AlmaLinux 8 so the binaries
  # need only glibc 2.28 (manylinux_2_28): what is built on a current distribution would not load on older ones.
  native:
    name: native ${{ matrix.rid }}
    needs: version
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: linux-x64, os: ubuntu-latest, container: 'almalinux:8', wheel: manylinux_2_28_x86_64 }
          - { rid: linux-arm64, os: ubuntu-24.04-arm, container: 'almalinux:8', wheel: manylinux_2_28_aarch64 }
          - { rid: win-x64, os: windows-latest, wheel: win_amd64, msvc: amd64 }
          - { rid: win-arm64, os: windows-11-arm, wheel: win_arm64, msvc: arm64 }
          - { rid: osx-arm64, os: macos-latest, wheel: macos }
          - { rid: osx-x64, os: macos-latest, wheel: macos, cross: x86_64 }
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.version.outputs.version }}
      RID: ${{ matrix.rid }}
      # The SDK itself does not need ICU for this; AlmaLinux images do not ship it.
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: ${{ matrix.container && '1' || '' }}
    steps:
      - name: Build tools (AlmaLinux 8)
        if: matrix.container
        run: dnf install -y --setopt=install_weak_deps=False git clang lld binutils zlib-devel tar gzip findutils which python3.12 python3.12-pip libicu

      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - uses: actions/setup-python@v6
        if: ${{ !matrix.container }}
        with:
          python-version: '3.13'

      - name: Microsoft C compiler (for the C smoke test)
        if: matrix.msvc
        shell: pwsh
        run: ./eng/msvc-env.ps1 ${{ matrix.msvc }}

      - name: Native library
        run: dotnet publish src/CoreIdml.Native -c Release -r "$RID" -p:Version="$VERSION" -p:CoreIdmlRelease=true

      - name: C smoke test
        env:
          # Git Bash would otherwise turn cl's /options into paths.
          MSYS_NO_PATHCONV: 1
          CC: ${{ matrix.container && 'clang' || 'cc' }}
        run: |
          out="artifacts/smoke/$RID"
          mkdir -p "$out"
          if [[ "$RUNNER_OS" == Windows ]]; then
            cl /nologo /W4 /WX /D_CRT_SECURE_NO_WARNINGS /Iinclude tests/native/smoke.c "artifacts/native/$RID/coreidml.lib" /Fo"$out/" /Fe"$out/smoke.exe"
            cp "artifacts/native/$RID/coreidml.dll" "$out/"
            "$out/smoke.exe" tests/fixtures/article-1photo.idml "$out"
          elif [[ -n "${{ matrix.cross }}" ]]; then
            "$CC" -arch "${{ matrix.cross }}" tests/native/smoke.c -Wall -Wextra -Werror -Iinclude -L"artifacts/native/$RID" -lcoreidml -Wl,-rpath,"$PWD/artifacts/native/$RID" -o "$out/smoke"
            arch "-${{ matrix.cross }}" "$out/smoke" tests/fixtures/article-1photo.idml "$out"
          else
            "$CC" tests/native/smoke.c -Wall -Wextra -Werror -Iinclude -L"artifacts/native/$RID" -lcoreidml -Wl,-rpath,"$PWD/artifacts/native/$RID" -o "$out/smoke"
            "$out/smoke" tests/fixtures/article-1photo.idml "$out"
          fi

      - name: Command line
        run: |
          dotnet publish src/CoreIdml.Cli -c Release -r "$RID" -p:Version="$VERSION" -p:CoreIdmlRelease=true
          cli="artifacts/cli/$RID/coreidml"
          [[ "$RUNNER_OS" == Windows ]] && cli="$cli.exe"
          run() { if [[ -n "${{ matrix.cross }}" ]]; then arch "-${{ matrix.cross }}" "$@"; else "$@"; fi; }
          run "$cli" summary tests/fixtures/article-1photo.idml --sections pages > summary.json
          grep -q '"pageCount"' summary.json
          run "$cli" to-pdf tests/fixtures/article-1photo.idml -o artifacts/smoke/cli.pdf --fonts tests/fixtures/fonts
          head -c 4 artifacts/smoke/cli.pdf | grep -q '%PDF'
          # Page previews: PDFium must load next to the binary on this platform.
          run "$cli" render tests/fixtures/article-1photo.idml --page 0 --dpi 50 -o artifacts/smoke/page.png
          [[ "$(head -c 4 artifacts/smoke/page.png | tail -c 3)" == PNG ]] || { echo "::error::render did not write a PNG"; exit 1; }
          # The same binary as an MCP server: initialize, then every tool is listed.
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"release-check","version":"1"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | run "$cli" mcp > artifacts/smoke/mcp.jsonl
          tools="$(grep -o '"name":"idml_[a-z_]*"' artifacts/smoke/mcp.jsonl | sort -u | wc -l | tr -d ' ')"
          echo "MCP server lists $tools tools"
          [[ "$tools" -ge 33 ]] || { echo "::error::the MCP server listed $tools tools"; cat artifacts/smoke/mcp.jsonl; exit 1; }

      - name: Python wheel
        run: |
          # On failure, the end of the output becomes an annotation (readable without access to the job log).
          log="$RUNNER_TEMP/python-wheel.log"
          exec > >(tee "$log") 2>&1
          trap 'echo "::error title=Python wheel ($RID)::$(tail -60 "$log" | sed -e "s/%/%25/g" -e "s/\r//g" | sed -e ":a" -e "N" -e "\$!ba" -e "s/\n/%0A/g")"' ERR
          python="python"
          [[ -n "${{ matrix.container }}" ]] && python="python3.12"
          tag="${{ matrix.wheel }}"
          if [[ "$tag" == macos ]]; then
            # The wheel says which macOS the library needs: the minimum version it was linked for.
            minos="$(otool -l artifacts/native/$RID/libcoreidml.dylib | awk '/minos/ { print $2; exit }')"
            arch="${{ matrix.cross || 'arm64' }}"
            tag="macosx_${minos%%.*}_0_${arch}"
          fi
          "$python" -m pip install --quiet build twine
          "$python" bindings/python/tools/build_wheel.py --rid "$RID" --plat-name "$tag" --version "$VERSION"
          "$python" -m twine check --strict artifacts/python/*.whl
          if [[ -z "${{ matrix.cross }}" ]]; then
            "$python" -m venv artifacts/venv
            venv_python="artifacts/venv/bin/python"
            [[ "$RUNNER_OS" == Windows ]] && venv_python="artifacts/venv/Scripts/python.exe"
            "$venv_python" -m pip install --quiet artifacts/python/*.whl
            # The tests import the installed package (with its bundled library), not the source tree.
            COREIDML_TEST_INSTALLED=1 "$venv_python" -m unittest discover -s bindings/python/tests -v
          fi
          if [[ -n "${{ matrix.container }}" ]]; then
            "$python" -m pip install --quiet auditwheel
            "$python" -m auditwheel show artifacts/python/*.whl
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.rid }}
          path: artifacts/native/${{ matrix.rid }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.rid }}
          path: artifacts/cli/${{ matrix.rid }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.rid }}
          path: artifacts/python/*.whl
          if-no-files-found: error

  android:
    name: native android
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Install the pinned NDK
        run: (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.3.13750724" > /dev/null
      - name: Build the Android libraries
        run: bash eng/build-android.sh -p:Version="$VERSION" -p:CoreIdmlRelease=true
      - uses: actions/upload-artifact@v7
        with:
          name: android-jniLibs
          path: artifacts/native/jniLibs
          if-no-files-found: error

  wasm:
    name: wasm
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: dotnet publish src/CoreIdml.Wasm -c Release -p:Version="$VERSION" -p:CoreIdmlRelease=true
      - name: Build and test the package
        working-directory: bindings/wasm
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run test:browser
      - uses: actions/upload-artifact@v7
        with:
          name: wasm
          path: artifacts/wasm
          if-no-files-found: error

  # Everything that is published, built once from the binaries above, and checked as the registries will see it.
  packages:
    name: packages
    needs: [version, native, android, wasm]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          path: artifacts/download

      - name: Lay out the binaries
        run: |
          for folder in artifacts/download/native-*; do
            rid="${folder#artifacts/download/native-}"
            mkdir -p "artifacts/native/$rid" && cp -r "$folder"/. "artifacts/native/$rid/"
          done
          mkdir -p artifacts/wasm && cp -r artifacts/download/wasm/. artifacts/wasm/
          ls -R artifacts/native | head -50

      - name: NuGet packages
        run: |
          for project in src/CoreIdml src/CoreIdml.Pdf src/CoreIdml.Cli; do
            dotnet pack "$project" -c Release -p:Version="$VERSION" -p:CoreIdmlRelease=true -o artifacts/nuget
          done
          ls -l artifacts/nuget

      - name: npm packages
        run: |
          node eng/set-version.mjs "$VERSION"
          (cd bindings/node && npm ci && npm run build)
          (cd bindings/wasm && npm ci && npm run build)
          node eng/stage-npm.mjs --version "$VERSION"
          mkdir -p artifacts/npm-tarballs
          for folder in artifacts/npm/*/; do
            (cd "$folder" && npm publish --dry-run --access public --tag ci > /dev/null && npm pack --pack-destination "$GITHUB_WORKSPACE/artifacts/npm-tarballs" > /dev/null)
          done
          ls -l artifacts/npm-tarballs

      - name: The staged npm package installs and works
        run: |
          mkdir -p artifacts/try-npm && cd artifacts/try-npm
          npm init -y > /dev/null
          npm install ../npm-tarballs/coreidml-node-linux-x64-*.tgz ../npm-tarballs/coreidml-node-[0-9]*.tgz ../npm-tarballs/coreidml-wasm-*.tgz > /dev/null
          node --input-type=module -e "
            import { CoreIdml } from '@coreidml/node';
            const idml = CoreIdml.load();
            const doc = idml.open('$GITHUB_WORKSPACE/tests/fixtures/article-1photo.idml');
            if (doc.info().stories.length === 0) throw new Error('no stories');
            console.log('@coreidml/node', idml.version, idml.libraryPath);
          "

      - name: Release archives
        run: |
          mkdir -p artifacts/release
          cd artifacts
          for folder in download/native-*; do
            rid="${folder#download/native-}"
            (cd "$folder" && zip -qr "../../release/coreidml-native-$VERSION-$rid.zip" .)
          done
          for folder in download/cli-*; do
            rid="${folder#download/cli-}"
            chmod +x "$folder"/coreidml 2>/dev/null || true
            if [[ "$rid" == win-* ]]; then
              (cd "$folder" && zip -qr "../../release/coreidml-cli-$VERSION-$rid.zip" .)
            else
              tar -czf "release/coreidml-cli-$VERSION-$rid.tar.gz" -C "$folder" .
            fi
          done
          # MCP Bundles: the MCP server as a one-click install for Claude Desktop. Packed here, on Linux, so the macOS
          # and Linux binaries keep their executable bit; the Linux CLI lists the tools for the manifest.
          for rid in win-x64 win-arm64 osx-arm64 osx-x64 linux-x64 linux-arm64; do
            node ../eng/pack-mcpb.mjs --rid "$rid" --cli "download/cli-$rid" --tools-from download/cli-linux-x64/coreidml \
              --version "$VERSION" --out "release/coreidml-$VERSION-$rid.mcpb"
          done
          (cd download/android-jniLibs && zip -qr "../../release/coreidml-android-$VERSION-jniLibs.zip" .)
          (cd download/wasm && zip -qr "../../release/coreidml-wasm-$VERSION.zip" .)
          cp download/wheel-*/*.whl release/
          cp nuget/*.nupkg release/
          cp npm-tarballs/*.tgz release/
          cd release && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: artifacts/release
          if-no-files-found: error

  # ---- Publishing rehearsal (every run that does not publish) ----------------------------------------------------
  # The publish steps against throwaway registries, then each package installed from its registry and used, the way a
  # user gets it: npm (Verdaccio), PyPI (pypiserver), NuGet (a local feed) and a draft GitHub release that is deleted
  # again. What only the real registries can check is their trust in this workflow (CONTRIBUTING.md).

  rehearsal:
    name: publish rehearsal
    needs: [version, packages]
    if: needs.version.outputs.publish != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      FIXTURE: ${{ github.workspace }}/tests/fixtures/article-1photo.idml
      FONTS: ${{ github.workspace }}/tests/fixtures/fonts
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: release
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: npm, through a registry
        run: |
          npm install -g npm@11 verdaccio@6 > /dev/null
          # Verdaccio's default body limit (10 MB) is far below npmjs.org's; a platform package is about 11 MB as sent.
          config="$RUNNER_TEMP/verdaccio.yaml"
          printf '%s\n' "storage: $RUNNER_TEMP/verdaccio-storage" 'max_body_size: 200mb' \
            'auth:' '  htpasswd:' "    file: $RUNNER_TEMP/verdaccio-htpasswd" \
            'uplinks:' '  npmjs:' '    url: https://registry.npmjs.org/' \
            'packages:' "  '**':" '    access: $all' '    publish: $authenticated' '    proxy: npmjs' \
            'log: { type: stdout, format: pretty, level: warn }' > "$config"
          verdaccio --config "$config" --listen 4873 > "$RUNNER_TEMP/verdaccio.log" 2>&1 &
          for i in $(seq 60); do curl -fs http://localhost:4873/-/ping > /dev/null && break; sleep 1; done
          token=$(curl -fs -X PUT -H 'content-type: application/json' -d '{"name":"rehearsal","password":"rehearsal-password"}' \
            http://localhost:4873/-/user/org.couchdb.user:rehearsal | python -c 'import json,sys; print(json.load(sys.stdin)["token"])')
          npm config set //localhost:4873/:_authToken "$token"
          npm config set registry http://localhost:4873/
          bash eng/publish-npm.sh release ci
          app="$RUNNER_TEMP/npm-app" && mkdir -p "$app" && cd "$app" && npm init -y > /dev/null
          npm install "@coreidml/node@$VERSION" "@coreidml/wasm@$VERSION"
          ls node_modules/@coreidml
          node --input-type=module -e "
            import { CoreIdml } from '@coreidml/node';
            const idml = CoreIdml.load();
            const doc = idml.open(process.env.FIXTURE);
            const { pdf } = await doc.exportPdfBytesAsync({ useSystemFonts: false, fontDirectories: [process.env.FONTS] });
            doc.close();
            if (!idml.libraryPath.includes('node-linux-x64')) throw new Error('library not from its platform package: ' + idml.libraryPath);
            console.log('@coreidml/node', idml.version, 'from', idml.libraryPath, '- PDF', pdf.length, 'bytes');
          "

      - name: PyPI, through a package index
        run: |
          python -m pip install --quiet pypiserver twine passlib
          mkdir -p "$RUNNER_TEMP/pypi"
          pypi-server run -p 8080 -a . -P . --disable-fallback "$RUNNER_TEMP/pypi" > "$RUNNER_TEMP/pypi.log" 2>&1 &
          for i in $(seq 60); do curl -fs http://localhost:8080/ > /dev/null && break; sleep 1; done
          python -m twine upload --non-interactive --repository-url http://localhost:8080/ -u rehearsal -p rehearsal release/*.whl
          python -m venv "$RUNNER_TEMP/venv"
          pyversion=$(ls release/coreidml-*-py3-none-manylinux_2_28_x86_64.whl | sed -E 's/.*coreidml-([^-]+)-py3.*/\1/')
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --index-url http://localhost:8080/simple/ "coreidml==$pyversion"
          "$RUNNER_TEMP/venv/bin/python" -c "
          import os, coreidml
          with coreidml.Document.open(os.environ['FIXTURE']) as doc:
              pdf, report = doc.export_pdf_bytes({'useSystemFonts': False, 'fontDirectories': [os.environ['FONTS']]})
          assert '_lib' in coreidml.library_path(), coreidml.library_path()
          print('coreidml', coreidml.version(), 'from', coreidml.library_path(), '- PDF', len(pdf), 'bytes')
          "

      - name: NuGet, through a feed
        run: |
          feed="$RUNNER_TEMP/feed" && mkdir -p "$feed"
          for package in release/*.nupkg; do dotnet nuget push "$package" --source "$feed"; done
          app="$RUNNER_TEMP/dotnet-app" && mkdir -p "$app" && cd "$app"
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<configuration><packageSources><clear />' \
            "<add key=\"rehearsal\" value=\"$feed\" />" '<add key="nuget.org" value="https://api.nuget.org/v3/index.json" />' \
            '</packageSources></configuration>' > nuget.config
          echo '{ "sdk": { "version": "11.0.100", "rollForward": "latestFeature" } }' > global.json
          dotnet new console --framework net11.0 > /dev/null
          dotnet add package CoreIdml.Pdf --version "$VERSION" > /dev/null
          printf '%s\n' 'using CoreIdml;' 'using CoreIdml.Pdf;' \
            'using var doc = IdmlDocument.Open(Environment.GetEnvironmentVariable("FIXTURE")!);' \
            'var options = new PdfExportOptions();' \
            'options.Fonts.UseSystemFonts = false;' \
            'options.Fonts.AddDirectory(Environment.GetEnvironmentVariable("FONTS")!);' \
            'using var output = new MemoryStream();' \
            'var result = IdmlPdf.Export(doc, output, options);' \
            'Console.WriteLine($"CoreIdml {IdmlDocument.LibraryVersion}: {doc.Stories.Count} stories, PDF {output.Length} bytes, {result.PageCount} page(s)");' > Program.cs
          dotnet run
          dotnet tool install CoreIdml.Cli --version "$VERSION" --tool-path "$RUNNER_TEMP/tools" --add-source "$feed"
          "$RUNNER_TEMP/tools/coreidml" summary "$FIXTURE" --sections pages | head -c 200; echo

      - name: GitHub release, as a draft deleted again
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="rehearsal-$GITHUB_RUN_ID"
          trap 'gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag > /dev/null 2>&1 || true' EXIT
          gh release create "$tag" release/* --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
            --title "Rehearsal $VERSION" --notes "Created and deleted by the release workflow's rehearsal."
          files=$(ls release | wc -l)
          assets=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')
          echo "draft release with $assets of $files files"
          [[ "$assets" == "$files" ]]

  # ---- Publishing (tags only) -----------------------------------------------------------------------------------

  nuget:
    name: publish NuGet
    needs: [version, packages]
    # Opt-in: set the repository variable NUGET_USER once nuget.org trusts this workflow.
    if: needs.version.outputs.publish == 'true' && vars.NUGET_USER != ''
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: release
      - uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}
      - run: dotnet nuget push "release/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

  npm:
    name: publish npm
    needs: [version, packages]
    # Opt-in: set the repository variable PUBLISH_NPM to true once the @coreidml scope is set up.
    if: needs.version.outputs.publish == 'true' && vars.PUBLISH_NPM == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: release
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Publish (platform packages first, then @coreidml/node, then @coreidml/wasm)
        env:
          # Only needed for the very first publish of a package; afterwards trusted publishing takes over.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm install -g npm@11
          tag=latest
          [[ "${{ needs.version.outputs.version }}" == *-* ]] && tag=next
          bash eng/publish-npm.sh release "$tag" --provenance

  pypi:
    name: publish PyPI
    needs: [version, packages]
    # Opt-in: set the repository variable PUBLISH_PYPI to true once PyPI trusts this workflow.
    if: needs.version.outputs.publish == 'true' && vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: release
      - run: mkdir dist && cp release/*.whl dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github:
    name: GitHub release
    needs: [version, packages, nuget, npm, pypi]
    # Every tag gets its GitHub release, with or without the registries: a registry that is not set up is skipped, one
    # that fails stops the release.
    if: >-
      !cancelled() && needs.version.outputs.publish == 'true' && needs.packages.result == 'success'
      && needs.nuget.result != 'failure' && needs.npm.result != 'failure' && needs.pypi.result != 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: release
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          [[ "${{ needs.version.outputs.version }}" == *-* ]] && prerelease="--prerelease"
          gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --title "CoreIdml ${{ needs.version.outputs.version }}" --generate-notes $prerelease
