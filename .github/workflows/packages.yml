name: Published packages

# Installs the published packages from npm, PyPI and nuget.org the way users do, on every platform, and runs the
# demos of samples/packages with them (Python, .NET, Node.js, the browser), plus the command line from npm and as a
# .NET tool. Runs after every release (the version main names once the release workflow has committed it), and by
# hand for any published version.

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to check (default: the version on the chosen branch, i.e. the last release)'
        required: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  version:
    name: version
    # After a release: only a tag's run that succeeded (main's dry runs publish nothing).
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - id: version
        name: Version to check
        env:
          REQUESTED: ${{ inputs.version }}
          TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [[ -n "$REQUESTED" ]]; then version="$REQUESTED"
          elif [[ -n "$TAG" ]]; then version="${TAG#v}"
          else version="$(node eng/set-version.mjs --print)"; fi
          # Every job checks out this commit, so a push to main while the registries are awaited changes nothing.
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Checking $version with the demos of $(git rev-parse --short HEAD)"
      # New versions take a while to be served everywhere: npm's CDN, nuget.org's indexing (often 10 minutes or more).
      - name: Wait until npm, PyPI and nuget.org serve it
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Every npm package, the platform packages too: npm skips an optional dependency it cannot fetch yet, and
          # the registry makes packages visible in its own order (v1.0.0: @coreidml/cli two minutes before some of
          # the platform packages it depends on).
          npm_packages=(node wasm cli)
          for platform in win32-x64 win32-arm64 darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            npm_packages+=("node-$platform" "cli-$platform")
          done
          served() {
            for name in "${npm_packages[@]}"; do
              npm view "@coreidml/$name@$VERSION" version > /dev/null 2>&1 || return 1
            done
            curl -fsS "https://pypi.org/pypi/coreidml/$VERSION/json" > /dev/null 2>&1 &&
            for id in coreidml coreidml.pdf coreidml.cli; do
              curl -fsS "https://api.nuget.org/v3-flatcontainer/$id/index.json" | grep -q "\"$VERSION\"" || return 1
            done
          }
          for attempt in $(seq 1 60); do
            if served; then
              echo "$VERSION is served everywhere."
              sleep 60 # and a minute more for the registries' caches to catch up
              exit 0
            fi
            sleep 30
          done
          echo "::error::$VERSION was not served by every registry within 30 minutes."
          exit 1

  demos:
    name: demos ${{ matrix.name }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-latest }
          - { name: linux-arm64, os: ubuntu-24.04-arm }
          - { name: win-x64, os: windows-latest }
          - { name: win-arm64, os: windows-11-arm }
          - { name: osx-arm64, os: macos-latest }
          - { name: osx-x64, os: macos-15-intel }
    env:
      VERSION: ${{ needs.version.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.commit }}
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          # The .NET packages target .NET 10 too.
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Pin the demos to the version
        run: node eng/set-version.mjs "$VERSION" > /dev/null && grep -h -E 'coreidml|CoreIdml' samples/packages/*/requirements.txt samples/packages/*/package.json samples/packages/dotnet/Demo.csproj

      - name: Python (coreidml from PyPI)
        working-directory: samples/packages/python
        run: |
          python -m pip install --quiet --no-cache-dir -r requirements.txt
          python demo.py
      - name: .NET 11 (CoreIdml.Pdf from nuget.org)
        working-directory: samples/packages/dotnet
        run: dotnet run -f net11.0
      - name: .NET 10 (CoreIdml.Pdf from nuget.org)
        working-directory: samples/packages/dotnet
        run: dotnet run -f net10.0
      - name: Node.js (@coreidml/node from npm)
        working-directory: samples/packages/node
        run: |
          npm install --no-package-lock --no-audit --no-fund
          node demo.mjs
      - name: Browser (@coreidml/wasm from npm, in headless Chrome)
        working-directory: samples/packages/web
        run: |
          npm install --no-package-lock --no-audit --no-fund
          status=0
          node serve.mjs --check || status=$?
          if [[ $status == 3 ]]; then echo "::warning::No Chrome on this runner; the browser demo was skipped."; exit 0; fi
          exit $status
      - name: Command line (@coreidml/cli from npm, and the CoreIdml.Cli .NET tool)
        run: |
          count() { python -c 'import json,sys; print(len(json.load(sys.stdin)))'; }
          npm_tools="$(npx -y "@coreidml/cli@$VERSION" tools | count)"
          dotnet tool install CoreIdml.Cli --version "$VERSION" --tool-path dotnet-tools > /dev/null
          tool_tools="$(./dotnet-tools/coreidml tools | count)"
          echo "npx @coreidml/cli: $npm_tools tools; dotnet tool CoreIdml.Cli: $tool_tools tools"
          [[ "$npm_tools" -gt 0 && "$npm_tools" == "$tool_tools" ]]
